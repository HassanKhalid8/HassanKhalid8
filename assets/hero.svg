<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Hassan Khalid — AI-powered products, from model to interface">
  <defs>
    <linearGradient id="bgg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0D14"/>
      <stop offset="55%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#120E24"/>
    </linearGradient>
    <linearGradient id="nameg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C4B5FD"/>
      <stop offset="45%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="1"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orbA" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8B5CF6" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <clipPath id="clipName"><rect x="60" y="60" width="0" height="70">
      <animate attributeName="width" dur="9s" repeatCount="indefinite"
        values="0;0;600;600;600" keyTimes="0;0.06;0.24;0.92;1" calcMode="spline"
        keySplines="0 0 1 1;.2 .8 .2 1;0 0 1 1;0 0 1 1"/>
    </rect></clipPath>
    <clipPath id="clipSub"><rect x="62" y="145" width="0" height="34">
      <animate attributeName="width" dur="9s" repeatCount="indefinite"
        values="0;0;520;520;520" keyTimes="0;0.28;0.5;0.92;1" calcMode="linear"/>
    </rect></clipPath>
  </defs>

  <rect width="1000" height="300" rx="18" fill="url(#bgg)"/>

  <g opacity="0.9">
    <g>
      <rect x="-40" y="-40" width="1080" height="380" fill="url(#grid)"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="0 40" dur="5s" repeatCount="indefinite"/>
    </g>
  </g>

  <ellipse cx="140" cy="70" rx="260" ry="160" fill="url(#orbA)">
    <animate attributeName="rx" values="260;310;260" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;1;0.8" dur="7s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="880" cy="250" rx="240" ry="150" fill="url(#orbB)">
    <animate attributeName="rx" values="240;300;240" dur="9s" repeatCount="indefinite"/>
  </ellipse>

  <g stroke="#22D3EE" stroke-width="2" fill="none" opacity="0.65">
    <path d="M24 54V24H54"/><path d="M976 54V24H946"/>
    <path d="M24 246v30h30"/><path d="M976 246v30h-30"/>
  </g>

  <g>
    <rect x="748" y="30" width="212" height="30" rx="15" fill="#0F172A" stroke="#22D3EE" stroke-opacity="0.45"/>
    <circle cx="768" cy="45" r="4.5" fill="#34D399">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="r" values="4.5;6.5;4.5" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="782" y="50" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" fill="#7DD3FC" letter-spacing="1.4">STATUS: OPEN TO WORK</text>
  </g>

  <g>
    <animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="1;1;0;1" keyTimes="0;0.9;0.965;1"/>
    <g clip-path="url(#clipName)">
      <text x="60" y="118" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" font-size="62" letter-spacing="2" fill="url(#nameg)" filter="url(#glow)">HASSAN KHALID</text>
    </g>
    <g clip-path="url(#clipSub)">
      <text x="62" y="170" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19" fill="#94A3B8" letter-spacing="0.6">
        <tspan fill="#8B5CF6">&gt;</tspan> building AI products <tspan fill="#22D3EE">model</tspan> → <tspan fill="#22D3EE">interface</tspan>
      </text>
    </g>
  </g>
  <rect x="586" y="148" width="11" height="26" fill="#22D3EE">
    <animate attributeName="opacity" values="1;0;1" dur="1.05s" repeatCount="indefinite"/>
    <animate attributeName="x" dur="9s" repeatCount="indefinite" values="66;66;586;586;586" keyTimes="0;0.28;0.5;0.92;1"/>
  </rect>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" letter-spacing="1.6">
    <line x1="120" y1="240" x2="880" y2="240" stroke="#334155" stroke-width="2"/>
    <line x1="120" y1="240" x2="880" y2="240" stroke="#22D3EE" stroke-width="2" stroke-dasharray="10 14" opacity="0.85">
      <animate attributeName="stroke-dashoffset" from="48" to="0" dur="1.1s" repeatCount="indefinite"/>
    </line>

    <g fill="#0F172A" stroke="#8B5CF6" stroke-opacity="0.7">
      <rect x="60" y="224" width="120" height="32" rx="9"/>
      <rect x="313" y="224" width="120" height="32" rx="9"/>
      <rect x="566" y="224" width="120" height="32" rx="9"/>
      <rect x="820" y="224" width="120" height="32" rx="9"/>
    </g>
    <g fill="#A78BFA" text-anchor="middle">
      <text x="120" y="244">DATA</text>
      <text x="373" y="244">MODEL</text>
      <text x="626" y="244">API</text>
      <text x="880" y="244">INTERFACE</text>
    </g>

    <circle r="6" fill="#22D3EE" filter="url(#glow)">
      <animateMotion dur="3.2s" repeatCount="indefinite" path="M120,240 H880" keyPoints="0;1" keyTimes="0;1" calcMode="spline" keySplines=".45 0 .55 1"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <rect x="0" y="292" width="1000" height="3" fill="url(#sweep)" opacity="0.9">
    <animate attributeName="x" values="-1000;1000" dur="3.6s" repeatCount="indefinite"/>
  </rect>
  <rect x="18" y="18" width="964" height="264" rx="14" fill="none" stroke="#8B5CF6" stroke-opacity="0.25"/>
</svg>
