<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 236" width="900" height="236" role="img" aria-label="Current status">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0D14"/>
      <stop offset="100%" stop-color="#11101F"/>
    </linearGradient>
    <linearGradient id="fill1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6D28D9"/><stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="fill2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED"/><stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="fill3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <filter id="sglow" x="-40%" y="-160%" width="180%" height="420%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="236" rx="14" fill="url(#sbg)" stroke="#8B5CF6" stroke-opacity="0.28"/>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <circle cx="30" cy="30" r="5" fill="#F87171"/>
    <circle cx="48" cy="30" r="5" fill="#FBBF24"/>
    <circle cx="66" cy="30" r="5" fill="#34D399"/>
    <text x="88" y="35" font-size="14" fill="#64748B">~/hassan</text>
    <line x1="20" y1="52" x2="880" y2="52" stroke="#8B5CF6" stroke-opacity="0.18"/>

    <text x="30" y="80" font-size="14.5" fill="#94A3B8"><tspan fill="#34D399">$</tspan> <tspan fill="#E2E8F0">hassan --status</tspan></text>

    <!-- row 1 -->
    <text x="30" y="117" font-size="13.5" fill="#C9D1D9">final-year engineering · GIKI '27</text>
    <rect x="400" y="107" width="380" height="10" rx="5" fill="#1E293B"/>
    <rect x="400" y="107" width="0" height="10" rx="5" fill="url(#fill1)" filter="url(#sglow)">
      <animate attributeName="width" dur="8s" repeatCount="indefinite"
        values="0;0;315;315;0;0" keyTimes="0;0.04;0.28;0.90;0.97;1"
        calcMode="spline" keySplines="0 0 1 1;.16 .9 .2 1;0 0 1 1;.4 0 .6 1;0 0 1 1"/>
    </rect>
    <text x="800" y="117" font-size="13" fill="#A78BFA" opacity="0">83%
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.26;0.32;0.90;0.94;1"/>
    </text>

    <!-- row 2 -->
    <text x="30" y="152" font-size="13.5" fill="#C9D1D9">ML models → production</text>
    <rect x="400" y="142" width="380" height="10" rx="5" fill="#1E293B"/>
    <rect x="400" y="142" width="0" height="10" rx="5" fill="url(#fill2)" filter="url(#sglow)">
      <animate attributeName="width" dur="8s" repeatCount="indefinite"
        values="0;0;342;342;0;0" keyTimes="0;0.10;0.34;0.90;0.97;1"
        calcMode="spline" keySplines="0 0 1 1;.16 .9 .2 1;0 0 1 1;.4 0 .6 1;0 0 1 1"/>
    </rect>
    <text x="800" y="152" font-size="13" fill="#22D3EE" opacity="0">90%
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.32;0.38;0.90;0.94;1"/>
    </text>

    <!-- row 3 -->
    <text x="30" y="187" font-size="13.5" fill="#C9D1D9">full-stack workflow, sharpened</text>
    <rect x="400" y="177" width="380" height="10" rx="5" fill="#1E293B"/>
    <rect x="400" y="177" width="0" height="10" rx="5" fill="url(#fill3)" filter="url(#sglow)">
      <animate attributeName="width" dur="8s" repeatCount="indefinite"
        values="0;0;361;361;0;0" keyTimes="0;0.16;0.40;0.90;0.97;1"
        calcMode="spline" keySplines="0 0 1 1;.16 .9 .2 1;0 0 1 1;.4 0 .6 1;0 0 1 1"/>
    </rect>
    <text x="800" y="187" font-size="13" fill="#34D399" opacity="0">95%
      <animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.38;0.44;0.90;0.94;1"/>
    </text>

    <!-- row 4 : open slot -->
    <text x="30" y="222" font-size="13.5" fill="#7DD3FC">your project</text>
    <rect x="400" y="212" width="380" height="10" rx="5" fill="none" stroke="#22D3EE" stroke-opacity="0.5" stroke-width="1.4" stroke-dasharray="7 6">
      <animate attributeName="stroke-dashoffset" from="26" to="0" dur="1.4s" repeatCount="indefinite"/>
    </rect>
    <text x="800" y="222" font-size="13" fill="#22D3EE" letter-spacing="1">OPEN
      <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
